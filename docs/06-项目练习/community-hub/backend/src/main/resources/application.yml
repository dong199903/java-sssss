server:
  port: 8080

spring:
  application:
    name: community-hub
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""

community:
  jwt:
    secret: community-hub-dev-secret-key-32b
    expire-days: 7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
